services:
  restor-pc:
    build:
      context: .
      args:
        # Uniquement NEXT_PUBLIC_* — valeurs fournies via le fichier .env local (non versionné).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_HERO_VARIANT: ${NEXT_PUBLIC_HERO_VARIANT}
        NEXT_PUBLIC_HERO_MOBILE_VARIANT: ${NEXT_PUBLIC_HERO_MOBILE_VARIANT}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
    container_name: restor-pc
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
